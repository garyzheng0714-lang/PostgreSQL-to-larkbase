[package]
name = "fbif-databridge"
version = "1.3.0"
edition = "2021"
rust-version = "1.82"
description = "FBIF DataBridge — 飞书多维表格数据同步连接器后端 (PostgreSQL)"
license = "MIT"

[[bin]]
name = "fbif-databridge"
path = "src/main.rs"

[dependencies]
# 运行时与 HTTP（tokio 官方生态系）
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
axum = "0.8"
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["timeout", "limit", "trace", "catch-panic", "cors"] }

# 序列化（验签需 raw body，故 handler 取 Bytes 后再反序列化）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

# 签名：SHA-1 拼接（非 HMAC）+ hex + 常量时间比较
sha1 = "0.10"
hex = "0.4"
subtle = "2"

# fieldID 生成（Python 用 md5）
md-5 = "0.10"

# PostgreSQL（纯 Rust，零 libpq）
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
deadpool-postgres = "0.14"

# TLS（纯 Rust，绕开 OpenSSL；用 ring provider 避免 aws-lc-rs 的 C 构建依赖）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-postgres-rustls = "0.13"
rustls-pemfile = "2"
webpki-roots = "0.26"

# 精确小数 / 日期
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }
chrono = { version = "0.4", features = ["serde"] }

# 适配器 trait（动态注册表，async-trait + boxing，见设计 §2.5）
async-trait = "0.1"

# 错误 / 日志 / 指标
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "unwind" # 保留 unwind，让 tower-http catch-panic 隔离单请求（见设计 §6.1）

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
