name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # -- Frontend Build --
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""
          VITE_HELPER_API_KEY: ${{ secrets.HELPER_API_KEY }}
        run: |
          if [ -z "$VITE_HELPER_API_KEY" ]; then
            echo "HELPER_API_KEY GitHub secret is required for helper API auth"
            exit 1
          fi
          npm ci
          npm run build

      # -- SSH Setup --
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # -- Deploy Frontend --
      - name: Deploy frontend static files
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ \
            root@${{ secrets.SERVER_HOST }}:/opt/pg2bitable/frontend/dist/

      # -- Deploy Backend & Rebuild --
      - name: Sync backend source
        run: |
          rsync -avz --delete \
            --exclude='.env*' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            -e "ssh -i ~/.ssh/deploy_key" \
            backend/ \
            root@${{ secrets.SERVER_HOST }}:/opt/pg2bitable/backend/

      - name: Rebuild and restart backend
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.SERVER_HOST }} << 'ENDSSH'
          set -e
          cd /opt/pg2bitable
          echo "Rebuilding backend container..."
          docker compose build backend
          docker compose up -d backend
          echo "Waiting for container to be healthy..."
          for i in $(seq 1 12); do
            STATUS=$(docker inspect pg2bitable-backend --format '{{.State.Health.Status}}' 2>/dev/null || echo "unknown")
            echo "  Attempt $i/12: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Deploy successful - container is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Container did not become healthy in 60s"
          docker logs pg2bitable-backend --tail 20
          exit 1
          ENDSSH

      # -- Verify --
      - name: Verify deployment
        run: |
          sleep 3
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://pg2bitable.garyzheng.com/meta.json)
          if [ "$STATUS" = "200" ]; then
            echo "Deployment verified - site is live"
          else
            echo "Warning: got HTTP $STATUS from site"
            exit 1
          fi
