name: Deploy to Production

# 生产（2026-09-13 起）：121.40.214.5，Rust 后端 + 静态前端，
# 由 /opt/fbif-one-api/services/postgres-to-feishu/compose.yaml 维护（容器 pg2bitable-backend-rs，127.0.0.1:18083）。
# 镜像在 CI 构建（服务器拉 Docker Hub 会鉴权失败，LTO=fat 也不适合在生产机编译），按提交 SHA 打 tag 传过去，
# 改 compose 的镜像 tag 后用服务器上的 deploy.sh 起新容器；健康或公网校验失败就回到上一个 tag 和上一版前端。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # HELPER_API_KEY 不进构建产物：配置页运行时向后端要（GET /api/helper/key），后端从中台文件拿
      - name: Test & build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""
        run: |
          npm ci
          npm test
          npm run build
          tar -czf /tmp/pg2-frontend-${GITHUB_SHA}.tgz -C dist .

      - name: Build Rust image
        working-directory: backend-rs
        run: |
          docker build -t fbif-databridge-rs:${GITHUB_SHA} .
          docker save fbif-databridge-rs:${GITHUB_SHA} | gzip > /tmp/pg2-image-${GITHUB_SHA}.tar.gz

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Ship image and frontend
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key \
            /tmp/pg2-image-${GITHUB_SHA}.tar.gz /tmp/pg2-frontend-${GITHUB_SHA}.tgz \
            root@"$SERVER_HOST":/tmp/

      - name: Deploy with rollback
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key root@"$SERVER_HOST" "SHA=${GITHUB_SHA} bash -s" <<'ENDSSH'
          set -euo pipefail
          DIR=/opt/fbif-one-api/services/postgres-to-feishu
          exec 9>/tmp/pg2bitable-deploy.lock
          flock 9

          gunzip -c /tmp/pg2-image-$SHA.tar.gz | docker load
          docker image inspect fbif-databridge-rs:$SHA >/dev/null

          cd "$DIR"
          # HELPER_API_KEY 归 FBIF 中台：本机代理写这个文件，compose.yaml 的 env_file 把它排在 runtime.env 后面、同名以它为准
          # （FBIF-One-Api docs/hub/公共变量和密钥.md）。和 compose 一样叠起来查，缺了就在替换后端前停下。
          HUB_ENV=/etc/fbif-hub/env/pg2bitable.env
          grep -qF "$HUB_ENV" compose.yaml || { echo "compose.yaml env_file does not include $HUB_ENV; deployment stopped before replacing the backend"; exit 1; }
          docker compose -f compose.yaml config --format json | jq -e '.services.bridge.environment.HELPER_API_KEY // "" | length > 0' >/dev/null \
            || { echo "HELPER_API_KEY is empty after layering $HUB_ENV; deployment stopped before replacing the backend"; exit 1; }
          PREV=$(awk '$1=="image:"{print $2; exit}' compose.yaml)
          echo "previous image: $PREV"
          cp compose.yaml compose.yaml.prev
          rm -rf frontend/dist.new
          mkdir -p frontend/dist.new
          tar --no-same-owner -xzf /tmp/pg2-frontend-$SHA.tgz -C frontend/dist.new
          test -s frontend/dist.new/index.html

          rollback() {
            echo "Deploy failed; restoring $PREV and the previous frontend"
            cp compose.yaml.prev compose.yaml
            if [ -d frontend/dist.prev ] && [ ! -d frontend/dist.new ]; then
              rm -rf frontend/dist && mv frontend/dist.prev frontend/dist
            fi
            rm -rf frontend/dist.new
            ./deploy.sh apply || true
            docker logs pg2bitable-backend-rs --tail 40 || true
          }
          trap 'rollback; exit 1' ERR

          sed -i "s#^\(\s*image:\s*\)fbif-databridge-rs:.*#\1fbif-databridge-rs:$SHA#" compose.yaml
          grep -q "fbif-databridge-rs:$SHA" compose.yaml
          ./deploy.sh apply
          test "$(docker inspect pg2bitable-backend-rs --format '{{.Config.Image}}')" = "fbif-databridge-rs:$SHA"

          rm -rf frontend/dist.prev
          mv frontend/dist frontend/dist.prev
          mv frontend/dist.new frontend/dist

          for path in /health /ready /meta.json /; do
            curl -fsS -o /dev/null --max-time 10 "https://pg2bitable.garyzheng.com$path"
          done
          # 配置页向新后端要得到 helper key（只判断非空，不打印）
          curl -fsS --max-time 10 https://pg2bitable.garyzheng.com/api/helper/key | jq -e '.key | length > 0' >/dev/null
          trap - ERR

          rm -f /tmp/pg2-image-$SHA.tar.gz /tmp/pg2-frontend-$SHA.tgz
          # 只留当前和上一个镜像（迁移基线 migrated-20260913 保留作回退）
          docker images fbif-databridge-rs --format '{{.Tag}}' \
            | grep -vxE "$SHA|${PREV#*:}|migrated-20260913" \
            | xargs -r -I{} docker rmi fbif-databridge-rs:{} || true
          echo "Deployed fbif-databridge-rs:$SHA"
          ENDSSH

      - name: Verify deployment
        run: |
          for path in /health /meta.json /; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://pg2bitable.garyzheng.com$path")
            echo "$path -> $code"
            [ "$code" = "200" ]
          done
