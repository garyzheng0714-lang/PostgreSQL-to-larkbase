name: Deploy Rust Backend (gray)

# 手动触发：在 CI 构建 Rust 镜像（LTO=fat 需充足内存，故不在生产机编译），
# 经 SSH 传到服务器起一个新容器（端口 18083），不改 Caddy —— 灰度，Python 继续服务。
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build Rust image
        working-directory: backend-rs
        run: docker build -t fbif-databridge-rs:latest .

      - name: Save image
        run: docker save fbif-databridge-rs:latest | gzip > /tmp/rs.tar.gz

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer image
        run: |
          scp -i ~/.ssh/deploy_key /tmp/rs.tar.gz \
            root@${{ secrets.SERVER_HOST }}:/tmp/rs.tar.gz

      - name: Load and run (gray, port 18083, no Caddy change)
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.SERVER_HOST }} bash -s <<'ENDSSH'
          set -e
          gunzip -f /tmp/rs.tar.gz
          docker load -i /tmp/rs.tar
          rm -f /tmp/rs.tar
          docker rm -f pg2bitable-backend-rs 2>/dev/null || true
          docker run -d --name pg2bitable-backend-rs --restart unless-stopped \
            -p 127.0.0.1:18083:18082 \
            --env-file /opt/pg2bitable/backend/.env.production \
            --network postgres_default \
            fbif-databridge-rs:latest
          echo "Waiting for Rust backend health on 18083..."
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18083/health >/dev/null 2>&1; then
              echo "OK - healthy"
              echo "--- meta.json ---"
              curl -s http://127.0.0.1:18083/meta.json | head -c 400; echo
              exit 0
            fi
            echo "  attempt $i/15..."; sleep 3
          done
          echo "FAILED to become healthy"; docker logs pg2bitable-backend-rs --tail 40; exit 1
          ENDSSH
